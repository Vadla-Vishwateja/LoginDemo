<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
</head>
<body>
    <center>
        <h1>Signup</h1>
        <form action="./index.html" method="get" >
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" pattern="[a-zA-Z0-9._%+-]+@(gmail|yahoo|outlook)\.(com|in|org)" required="">
            <br><br><label for="password">Password  :</label>
            <input type="password" id="password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&amp;*]).{8,16}" name="password" placeholder="Enter your password" required="">
            <br><br><label for="password">Confirm Password  :</label>
            <input type="password" id="password" 
                pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&amp;*]).{8,16}" name="password" placeholder="Enter your password" required="">
            <br> 
            <br>
            <input type="submit" value="signup"> 
        </form>
    </center>
</body>
</html>
